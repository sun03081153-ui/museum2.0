<html lang="zh-Hant">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="main.css">
        <link rel="stylesheet" href="https://unpkg.com/flickity@2/dist/flickity.min.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@300;400;500" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>和服發展之時間線 - 衣為心聲</title>
        <style>
            /* 漂浮導覽選單樣式 */
            .floating-menu {
                position: fixed;
                right: 30px;
                top: 50%;
                transform: translateY(-50%);
                background: rgba(255, 255, 255, 0.95);
                padding: 20px;
                border-radius: 15px;
                box-shadow: 0 8px 30px rgba(0,0,0,0.15);
                z-index: 1000;
                border-left: 6px solid var(--color1); /* 使用您定義的深紅色 */
                width: 200px;
                transition: all 0.3s ease;
            }

            .current-era {
                font-size: 0.9rem;
                color: var(--color1);
                font-weight: 600;
                margin-bottom: 15px;
                border-bottom: 1px solid #eee;
                padding-bottom: 8px;
                text-align: left;
            }

            .current-era span {
                display: block;
                color: var(--primary-color);
                margin-top: 4px;
                font-size: 1.1rem;
            }

            .era-links {
                list-style: none;
                padding: 0;
                margin: 0;
                text-align: left;
            }

            .era-links li {
                margin: 12px 0;
            }

            .era-links a {
                text-decoration: none;
                color: #666;
                font-size: 0.95rem;
                transition: 0.3s;
                display: block;
            }

            .era-links a:hover, .era-links a.active {
                color: var(--color1);
                font-weight: 600;
                transform: translateX(5px);
            }

            /* 手機版適應：將選單縮小或置底 */
            @media (max-width: 768px) {
                .floating-menu {
                    width: 140px;
                    right: 10px;
                    padding: 12px;
                    font-size: 0.8rem;
                }
                .current-era span { font-size: 0.9rem; }
                .era-links a { font-size: 0.8rem; }
            }

            /* 平滑滾動 */
            html {
                scroll-behavior: smooth;
            }
        </style>
    </head>
