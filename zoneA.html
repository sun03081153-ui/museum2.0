<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="adopt.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@300;400;500" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>和服發展之時間線 - 衣為心聲</title>
    
    <style>
        /* --- 懸浮窗統一樣式 (位置鎖定) --- */
        .floating-wrapper {
            position: fixed;
            right: 30px; /* 距離右側固定 30px */
            top: 50%;
            transform: translateY(-50%);
            z-index: 999999;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 15px;
        }

        .menu-toggle {
            width: 55px;
            height: 55px;
            background-color: var(--color1, #6C0820);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .floating-menu {
            background: #ffffff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            border-left: 6px solid var(--color1, #6C0820);
            min-width: 180px;
            display: none; /* 預設隱藏 */
            animation: slideIn 0.3s ease-out;
        }

        .show-menu .floating-menu { display: block; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .current-area-hint {
            font-size: 13px;
            color: #888;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        #active-era-text {
            display: block;
            color: var(--color1, #6C0820);
            font-weight: 600;
            font-size: 15px;
            margin-top: 2px;
        }

        .era-links { list-style: none; padding: 0; margin: 0; text-align: left; }
        .era-links li { margin: 12px 0; }
        .era-links a { text-decoration: none; color: #444; font-size: 15px; transition: 0.3s; display: block; }
        .era-links a.active { color: var(--color1, #6C0820) !important; font-weight: 700; transform: translateX(8px); }

        /* --- 樹線時間軸 --- */
        .timeline-visual { position: relative; width: 80%; margin: 50px auto; padding: 20px 0; }
        .timeline-line { position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background-color: var(--color1); transform: translateY(-50%); z-index: 1; }
        .timeline-points { display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2; }
        .tp { display: flex; flex-direction: column; align-items: center; }
        .tp-dot { width: 12px; height: 12px; background-color: var(--color1); border-radius: 50%; margin: 10px 0; border: 3px solid white; box-shadow: 0 0 5px rgba(0,0,0,0.2); }
        .tp-era { font-weight: 500; font-size: 0.95rem; }
        .tp-year { font-size: 0.8rem; color: #888; }

        /* --- 圖片與版面控制 --- */
        .exhibit-img { width: 45%; max-width: 400px; flex-shrink: 0; }
        .exhibit-img img { width: 100%; height: auto; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .exhibit-item { display: flex; flex-direction: row; align-items: flex-start; justify-content: center; gap: 30px; max-width: 85%; margin: 0 auto 60px auto; }

        @media (max-width: 768px) {
            .exhibit-item { flex-direction: column; align-items: center; }
            .exhibit-img { width: 90%; }
            .floating-wrapper { right: 15px; }
        }
        html { scroll-behavior: smooth; }
    </style>
    <script>
        const savedColor = localStorage.getItem('kimonoThemeColor');
        if (savedColor) { document.documentElement.style.setProperty('--color1', savedColor); }
    </script>
</head>
<body class="kiwi-maru-regular">

    <div id="floating-wrapper" class="floating-wrapper">
        <button id="menu-toggle" class="menu-toggle"><i class="ri-history-line"></i></button>
        <div id="floating-ui" class="floating-menu">
            <div class="current-area-hint">目前位置：<span id="active-era-text">導覽開始</span></div>
            <ul class="era-links">
                <li><a href="#era-yayoi" class="nav-item">彌生時代</a></li>
                <li><a href="#era-nara" class="nav-item">奈良時代</a></li>
                <li><a href="#era-heian" class="nav-item">平安時代</a></li>
                <li><a href="#era-muromachi" class="nav-item">室町時代</a></li>
                <li><a href="#era-edo" class="nav-item">江戶時代</a></li>
                <li><a href="#era-modern" class="nav-item">現代發展</a></li>
            </ul>
        </div>
    </div>

    <div class="banner">
        <nav class="navbar">
            <a href="index.html">首頁</a><a href="about.html">關於我們</a><a href="knowledge.html">策展理念</a><a href="info.html">最新消息</a><a class="active" href="content.html">進入展覽</a>
        </nav>
        <h1>衣為心聲</h1>
        <svg class="wave" viewBox="0 0 1440 120" preserveAspectRatio="none"><path d="M0,60 C 240,90 480,30 720,60 C 960,90 1200,30 1440,60 L1440,120 L0,120 Z" fill="var(--color1)"/></svg>
    </div>

    <div class="timeline">
        <div class="titles">
            <span class="top-title">和服發展之時間線</span>
            <span class="exhibit-subtitle">探討從原始型態到現代文化的演變。</span>
        </div>

        <div class="timeline-visual">
            <div class="timeline-line"></div>
            <div class="timeline-points">
                <div class="tp"><span class="tp-era">彌生</span><div class="tp-dot"></div><span class="tp-year">BC 300</span></div>
                <div class="tp"><span class="tp-era">奈良</span><div class="tp-dot"></div><span class="tp-year">AD 710</span></div>
                <div class="tp"><span class="tp-era">平安</span><div class="tp-dot"></div><span class="tp-year">AD 794</span></div>
                <div class="tp"><span class="tp-era">室町</span><div class="tp-dot"></div><span class="tp-year">AD 1336</span></div>
                <div class="tp"><span class="tp-era">江戶</span><div class="tp-dot"></div><span class="tp-year">AD 1603</span></div>
                <div class="tp"><span class="tp-era">現代</span><div class="tp-dot"></div><span class="tp-year">AD 1868</span></div>
            </div>
        </div>

        <div class="exhibit" id="era-yayoi">
            <div class="exhibit-desc"><span class="exhibit-title">彌生時代</span></div>
            <div class="exhibit-item">
                <div class="exhibit-img"><img src="./src/timeline/彌生時代_貫頭衣.jpg"></div>
                <div class="exhibit-description"><h3>貫頭衣</h3><p>和服最初的型態為簡單的布料組合。</p></div>
            </div>
        </div>
        </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const wrapper = document.getElementById('floating-wrapper');
            const toggleBtn = document.getElementById('menu-toggle');
            const navItems = document.querySelectorAll('.nav-item');
            const activeText = document.getElementById('active-era-text');

            toggleBtn.addEventListener('click', (e) => { e.stopPropagation(); wrapper.classList.toggle('show-menu'); });
            document.addEventListener('click', (e) => { if (!wrapper.contains(e.target)) wrapper.classList.remove('show-menu'); });

            function scrollSpy() {
                const sections = document.querySelectorAll('.exhibit');
                let currentId = ""; let currentTitle = "導覽開始";
                sections.forEach(section => {
                    const rect = section.getBoundingClientRect();
                    if (rect.top <= 250) {
                        currentId = section.getAttribute('id');
                        const titleNode = section.querySelector('.exhibit-title');
                        if (titleNode) currentTitle = titleNode.innerText;
                    }
                });
                if (activeText) activeText.innerText = currentTitle;
                navItems.forEach(link => {
                    link.classList.remove('active');
                    if (currentId && link.getAttribute('href') === '#' + currentId) link.classList.add('active');
                });
            }
            window.addEventListener('scroll', scrollSpy);
            window.addEventListener('load', scrollSpy);
        });
    </script>
</body>
</html>
