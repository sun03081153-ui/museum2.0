<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="adopt.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@300;400;500" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>江戶時期未婚女性之服飾 - 衣為心聲</title>
    
    <style>
        /* --- 統一懸浮窗樣式 (與 A 一致) --- */
        .floating-wrapper { position: fixed; right: 25px; top: 50%; transform: translateY(-50%); z-index: 999999; display: flex; flex-direction: column; align-items: flex-end; gap: 15px; }
        .menu-toggle { width: 50px; height: 50px; background-color: var(--color1, #6C0820); color: white; border: none; border-radius: 50%; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; justify-content: center; align-items: center; font-size: 24px; transition: 0.3s; }
        .floating-menu { background: #ffffff; padding: 20px; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); border-left: 6px solid var(--color1, #6C0820); min-width: 180px; display: none; animation: slideIn 0.3s ease-out; }
        .show-menu .floating-menu { display: block; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
        .current-area-hint { font-size: 13px; color: #888; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #eee; text-align: left; }
        #active-era-text { display: block; color: var(--color1, #6C0820); font-weight: 600; font-size: 15px; margin-top: 2px; }
        .era-links { list-style: none; padding: 0; margin: 0; text-align: left; }
        .era-links li { margin: 12px 0; }
        .era-links a { text-decoration: none; color: #444; font-size: 15px; transition: 0.3s; }
        .era-links a.active { color: var(--color1, #6C0820) !important; font-weight: 700; transform: translateX(8px); }

        /* --- 圖片與色彩按鈕樣式 --- */
        .exhibit-img { width: 45%; max-width: 400px; flex-shrink: 0; }
        .exhibit-img img { width: 100%; height: auto; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .exhibit-item { display: flex; flex-direction: row; align-items: flex-start; justify-content: center; gap: 30px; max-width: 85%; margin: 0 auto 50px auto; }
        .color-btn { width: 25px; height: 25px; border-radius: 50%; cursor: pointer; border: 2px solid white; box-shadow: 0 0 3px rgba(0,0,0,0.3); margin: 10px 0; display: inline-block; }

        @media (max-width: 768px) { .exhibit-item { flex-direction: column; align-items: center; } .exhibit-img { width: 90%; } }
        html { scroll-behavior: smooth; }
    </style>
    <script>
        function changeThemeColor(color) { document.documentElement.style.setProperty('--color1', color); localStorage.setItem('kimonoThemeColor', color); }
        const savedColor = localStorage.getItem('kimonoThemeColor');
        if (savedColor) { document.documentElement.style.setProperty('--color1', savedColor); }
    </script>
</head>
<body class="kiwi-maru-regular">

    <div id="floating-wrapper" class="floating-wrapper">
        <button id="menu-toggle" class="menu-toggle"><i class="ri-history-line"></i></button>
        <div id="floating-ui" class="floating-menu">
            <div class="current-area-hint">目前位置：<span id="active-era-text">導覽開始</span></div>
            <ul class="era-links">
                <li><a href="#era-early" class="nav-item">江戶初期</a></li>
                <li><a href="#era-transition" class="nav-item">初中期過渡</a></li>
                <li><a href="#era-middle" class="nav-item">江戶中期</a></li>
                <li><a href="#era-late" class="nav-item">江戶末期</a></li>
            </ul>
        </div>
    </div>

    <div class="banner">
        <nav class="navbar">
            <a href="index.html">首頁</a><a href="about.html">關於我們</a><a href="knowledge.html">策展理念</a><a href="info.html">最新消息</a><a class="active" href="content.html">進入展覽</a>
        </nav>
        <h1>衣為心聲</h1>
        <svg class="wave" viewBox="0 0 1440 120" preserveAspectRatio="none"><path d="M0,60 C 240,90 480,30 720,60 C 960,90 1200,30 1440,60 L1440,120 L0,120 Z" fill="var(--color1)"/></svg>
    </div>

    <div class="jhkimono">
        <div class="titles">
            <span class="top-title">江戶時期：階級與時尚</span>
            <span class="exhibit-subtitle">分析袖長如何反映當時的適婚年齡識別。</span>
        </div>

        <div class="exhibit" id="era-early">
            <div class="exhibit-desc"><span class="exhibit-title">江戶初期</span></div>
            <div class="exhibit-item">
                <div class="exhibit-img"><img src="./src/edo/江戶初期-振袖.jpg"></div>
                <div class="exhibit-description">
                    <div class="color-btn" style="background-color: #6c085f;" onclick="changeThemeColor('#6c085f')"></div>
                    <p>這是一件肩部有大朵菊花圖案的振袖，反映了寬文時期的靈動設計。</p>
                </div>
            </div>
        </div>
        </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const wrapper = document.getElementById('floating-wrapper');
            const toggleBtn = document.getElementById('menu-toggle');
            const navItems = document.querySelectorAll('.nav-item');
            const activeText = document.getElementById('active-era-text');

            toggleBtn.addEventListener('click', (e) => { e.stopPropagation(); wrapper.classList.toggle('show-menu'); });
            document.addEventListener('click', (e) => { if (!wrapper.contains(e.target)) wrapper.classList.remove('show-menu'); });

            function scrollSpy() {
                const sections = document.querySelectorAll('.exhibit');
                let currentId = ""; let currentTitle = "導覽開始";
                sections.forEach(section => {
                    const rect = section.getBoundingClientRect();
                    if (rect.top <= 250) {
                        currentId = section.getAttribute('id');
                        const titleNode = section.querySelector('.exhibit-title');
                        if (titleNode) currentTitle = titleNode.innerText;
                    }
                });
                if (activeText) activeText.innerText = currentTitle;
                navItems.forEach(link => {
                    link.classList.remove('active');
                    if (currentId && link.getAttribute('href') === '#' + currentId) link.classList.add('active');
                });
            }
            window.addEventListener('scroll', scrollSpy);
            window.addEventListener('load', scrollSpy);
        });
    </script>
</body>
</html>
