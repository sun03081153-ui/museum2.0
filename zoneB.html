    <style>
        /* --- 懸浮窗縮放結構 CSS --- */
        .floating-wrapper {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 999999;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        /* 切換按鈕樣式 */
        .menu-toggle {
            width: 50px;
            height: 50px;
            background-color: var(--color1, #6C0820);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            transition: 0.3s;
        }

        .menu-toggle:hover {
            transform: scale(1.1);
        }

        /* 選單內容 (預設隱藏) */
        .floating-menu {
            background: #ffffff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border-left: 6px solid var(--color1, #6C0820);
            width: auto;
            min-width: 150px;
            display: none; /* 初始隱藏 */
            animation: fadeInRight 0.3s ease-out;
        }

        /* 當含有 show-menu 類別時顯示 */
        .show-menu .floating-menu {
            display: block;
        }

        /* 展開動畫 */
        @keyframes fadeInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .era-links {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .era-links li {
            margin: 15px 0;
        }

        .era-links a {
            text-decoration: none;
            color: #444;
            font-size: 16px;
            transition: 0.3s;
            display: block;
            font-weight: 500;
            white-space: nowrap;
        }

        .era-links a.active {
            color: var(--color1, #6C0820) !important;
            font-weight: 700;
            transform: translateX(8px);
        }

        /* 限制圖片寬度 (不滿版) */
        .exhibit-img {
            width: 45%;
            max-width: 400px;
            flex-shrink: 0;
        }

        .exhibit-img img {
            width: 100%;
            height: auto;
            max-height: 450px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .exhibit-item {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            justify-content: center;
            gap: 30px;
            max-width: 85%;
            margin: 0 auto 40px auto;
        }

        @media (max-width: 768px) {
            .exhibit-item { flex-direction: column; align-items: center; }
            .exhibit-img { width: 90%; max-width: none; }
            .floating-wrapper { right: 10px; }
        }

        html { scroll-behavior: smooth; }

        .color-btn {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 0 3px rgba(0,0,0,0.3);
            margin: 10px 0;
            display: inline-block;
        }
    </style>
